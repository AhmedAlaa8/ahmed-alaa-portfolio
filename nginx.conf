server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Relative redirects keep the host port (/ar -> /ar/ on :3020).
    absolute_redirect off;

    # The build ships a .gz next to every text asset; on-the-fly gzip covers anything it missed.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/plain application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        # HTML names never change, so browsers must revalidate to pick up a new build.
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets never change for a given filename.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public assets are not content-hashed: cache for a week, not forever.
    location ~ ^/(toolkit|flags)/ {
        expires 7d;
    }

    error_page 404 /404.html;
}
